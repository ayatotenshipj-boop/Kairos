name: compat

# Smoke test multi-SO rápido: valida que o projeto compila e importa em
# Linux/Windows/macOS SEM rodar o Nuitka (lento e arriscado em RAM). Complementa
# o build.yml (build final do binário); aqui é feedback rápido a cada push/PR —
# pega erro de sintaxe e import quebrado cross-SO (path hardcoded, import
# Linux-only) cedo e barato. ~2-4 min por SO.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # 3.12: mesma versão do build.yml — cobertura de wheels p/ PySide6 e as
      # C-ext (av, ctranslate2, onnxruntime, tokenizers).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Importar PySide6 (QtGui/QtQml) num runner headless precisa das libs
      # nativas do Qt. Sem elas o import falha com 'libEGL.so.1: cannot open
      # shared object file'. macOS/Windows já trazem o equivalente.
      - name: Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      # Mesma instalação do build.yml: PySide6 não vem do pacman no runner →
      # pip. Addons garante QtQuick/QML (QQmlApplicationEngine). Constraints
      # fixam as versões testadas. requirements-dev (Nuitka) NÃO entra — o smoke
      # não builda.
      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -c .github/constraints.txt PySide6 PySide6-Addons
          pip install -c .github/constraints.txt -r requirements.txt

      # compileall pega erro de sintaxe em TODO .py do pacote, em cada SO.
      - name: Compile all (sintaxe)
        shell: bash
        run: python -m compileall -q kairos/

      # Import real do app: confirma que a cadeia de imports (PySide6, pipeline,
      # integrations, config) resolve em cada SO. main() é guardado por
      # __main__, então importar NÃO cria QApplication; QT_QPA_PLATFORM=offscreen
      # é segurança extra caso algum import toque a plataforma gráfica.
      - name: Import smoke (cross-OS)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import kairos.main; print('import OK')"
